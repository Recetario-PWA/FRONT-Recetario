<ion-content [fullscreen]="true">

  <div class="top-label">
    Hecho por Fer y Jess
  </div>

  <div class="main-content"></div>

  <ion-footer class="ion-no-border" translucent>
    <div class="footer-content">
      <div class="heading">
        <h1>Bienvenid@ 🍽️</h1>
        <p>Descubre, guarda y comparte tus recetas favoritas</p>
      </div>

      <div class="actions">
        <ion-button class="login" size="large" routerLink="/auth/login">
          Iniciar sesión
        </ion-button>
        <p><a routerLink="/auth/register">Crear una cuenta nueva</a></p>
      </div>
    </div>
  </ion-footer>
</ion-content>
