<ion-header class="ion-no-border" mode="ios">
  <ion-toolbar class="wrapper">
    <ion-item lines="none">
      <ion-buttons slot="start">
        <ion-back-button mode="md" defaultHref="/tabs/dashboard" text=""></ion-back-button>
      </ion-buttons>
      <ion-label>
        <p>Mis comentarios</p>
      </ion-label>
    </ion-item>
  </ion-toolbar>
</ion-header>

<ion-content class="hide-scrollbar">
  <p class="indication ion-margin-horizontal">Desliza a la izquierda para ver los detalles o a la derecha para eliminar.</p>
  <ion-list>
    
    <ion-item-sliding #slidingItem>
      <ion-item-options side="start">
        <ion-item-option color="primary">
          <ion-icon slot="icon-only" color="light" name="eye-outline"></ion-icon>
        </ion-item-option>
      </ion-item-options>
      <ion-item lines="full">
        <div>
          <ion-label>Receta</ion-label>
          <ion-text>10 Septiembre 2025</ion-text>
        </div>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="deleteAlert(slidingItem)">
          <ion-icon slot="icon-only" slot="icon-only" name="trash-outline"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>

  </ion-list>
</ion-content>
