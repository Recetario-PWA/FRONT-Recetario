<ion-content [fullscreen]="true">
<ion-header class="ion-no-border">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-back-button mode="md" defaultHref="/" text=""></ion-back-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  <ion-grid>
    <ion-label color="white" class="ion-margin">
      ¡Hola de nuevo! ✨
    </ion-label>
    <h4 class="info ion-margin">Inicia sesión para continuar.</h4>
  </ion-grid>

  <ion-row>
    <ion-list lines="full">
      <ion-item-group class="ion-margin-bottom">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <!-- EMAIL -->
        <div>
          <ion-item lines="none">
            <ion-label position="stacked">Correo electronico</ion-label>
            <input value="" type="email" placeholder="ejemplo@gmail.com" formControlName="email">
            <app-error-messages [control]="getControl('email')" label="Este campo"></app-error-messages>
          </ion-item>
        </div>

        <!-- PASSWORD -->
        <div>
          <ion-item lines="none">
            <ion-label position="stacked">Contraseña</ion-label>
              <ion-input type="password" formControlName="password">
              <ion-input-password-toggle slot="end"></ion-input-password-toggle>
            </ion-input>
            <app-error-messages [control]="getControl('password')" label="Este campo"></app-error-messages>
          </ion-item>
        </div>
        
        <div class="forgot-password ion-margin">
          <a routerLink="/auth/email-check" class="forgot-password">
            ¿Olvidaste tu contraseña?
          </a>
        </div>

        <div class="ion-margin-horizontal captcha">
          <ngx-recaptcha2
            [siteKey]="siteKey"
            formControlName="captcha"
            [hl]="lang"
            >
          </ngx-recaptcha2>
        </div>

        <ion-button type="submit" [disabled]="loading()" size="large" expand="block" class="login-btn ion-margin-horizontal">Iniciar sesión</ion-button> 
      </form>

      <p>¿Eres nuevo? <a routerLink="/auth/register">Registrate aquí</a></p>
      </ion-item-group>
    </ion-list>
  </ion-row>
</ion-content>
