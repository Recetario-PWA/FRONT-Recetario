<ion-content [fullscreen]="true">
<ion-header class="ion-no-border">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-back-button mode="md" defaultHref="/"></ion-back-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  <ion-grid>
    <ion-label color="white" class="ion-margin">
      Ingresa tu código 
    </ion-label>
    <h4 class="info ion-margin">Revisa tu correo electrónico y escribe el código de seguridad.</h4>
  </ion-grid>

  <ion-row>
    <ion-list lines="full">
      <ion-item-group class="ion-margin-horizontal ion-margin-bottom">
        <form [formGroup]="codeForm" (ngSubmit)="onSubmit()">
          <!-- CODE -->
          <ion-input-otp formControlName="code" length="5" separators="all" type="text"> ¿No recibiste ningún código? <a (click)="resendCode()">Solicitar nuevo código</a> </ion-input-otp>
          <app-error-messages [control]="getControl('code')" label="El código"></app-error-messages>

          <!-- SUBMIT BUTTON -->
          <ion-button type="submit" [disabled]="loading()" size="large" expand="block" class="login-btn">Verificar</ion-button> 
      </form>
      </ion-item-group>
    </ion-list>
  </ion-row>
</ion-content>
