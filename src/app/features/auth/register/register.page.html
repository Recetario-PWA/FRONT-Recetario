<ion-content [fullscreen]="true">
<ion-header class="ion-no-border">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-back-button mode="md" defaultHref="/" text=""></ion-back-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  <ion-grid>
    <ion-label color="white" class="ion-margin">
      Crear cuenta ✨
    </ion-label>
    <h4 class="info ion-margin">Completa tus datos para unirte a la comunidad.</h4>
  </ion-grid>

  <ion-row>
    <ion-list lines="full">
      <ion-item-group class="ion-margin-horizontal ion-margin-bottom">
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <!-- NOMBRE -->
        <ion-item lines="none">
          <ion-label position="stacked">Nombre(s)</ion-label>
          <input formControlName="name" value="" type="text" placeholder="Ej. Tyler">
          <app-error-messages [control]="getControl('name')" label="Este campo"></app-error-messages>
        </ion-item>

        <ion-item lines="none">
          <ion-label position="stacked">Apellidos(s)</ion-label>
          <input formControlName="last_name" type="text" placeholder="Ej. Joseph">
          <app-error-messages [control]="getControl('last_name')" label="Este campo"></app-error-messages>
        </ion-item>

        <ion-item lines="none">
          <ion-label position="stacked">Username</ion-label>
          <input formControlName="user_name" type="text" placeholder="tylerrjoseph">
          <app-error-messages [control]="getControl('user_name')" label="Este campo"></app-error-messages>
        </ion-item>

        <ion-item lines="none">
          <ion-label position="stacked">Género</ion-label>
          <ion-select formControlName="gender" class="ion-margin-bottom" mode="md" aria-label="Genero" interface="popover" placeholder="Seleccionar">
            <ion-select-option value="femenino">Femenino</ion-select-option>
            <ion-select-option value="masculino">Masculino</ion-select-option>
            <ion-select-option value="39 tipos de gays">39 tipos de gays🏳️‍🌈</ion-select-option>
          </ion-select>
          <app-error-messages [control]="getControl('gender')" label="Este campo"></app-error-messages>
        </ion-item>

        <ion-item lines="none">
          <ion-label position="stacked">Correo electronico</ion-label>
          <input formControlName="email" type="email" placeholder="ejemplo@gmail.com">
          <app-error-messages [control]="getControl('email')" label="Este campo"></app-error-messages>
        </ion-item>
        
        <ion-item lines="none">
          <ion-label position="stacked">Contraseña</ion-label>
          <ion-input formControlName="password" type="password">
            <ion-input-password-toggle slot="end"></ion-input-password-toggle>
          </ion-input>
          <app-error-messages [control]="getControl('password')" label="Este campo"></app-error-messages>
        </ion-item>

        <ion-item lines="none">
          <ion-label position="stacked">Confirmar contraseña</ion-label>
          <ion-input formControlName="password_confirmation" type="password">
            <ion-input-password-toggle slot="end"></ion-input-password-toggle>
          </ion-input>
          <app-error-messages [control]="getControl('password_confirmation')" label="Este campo"></app-error-messages>
        </ion-item>

        <ion-button type="submit" [disabled]="loading()" size="large" class="btnCustom" expand="block">Registrarse</ion-button>
      </form>

      <p>¿Ya tienes una cuenta? <a routerLink="/auth/login">Iniciar Sesión</a></p>
      </ion-item-group>
    </ion-list>
  </ion-row>
</ion-content>
