<ion-content [fullscreen]="true">
<ion-header class="ion-no-border">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-back-button mode="md" defaultHref="/" text=""></ion-back-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  <ion-grid>
    <ion-label color="white" class="ion-margin">
      Crear cuenta ✨
    </ion-label>
    <h4 class="info ion-margin">Completa tus datos para unirte a la comunidad.</h4>
  </ion-grid>

  <ion-row>
    <ion-list lines="full">
      <ion-item-group class="ion-margin-horizontal ion-margin-bottom">
        <form>
        <!-- NOMBRE -->
        <ion-item lines="none">
          <ion-label position="stacked">Nombre(s)</ion-label>
          <input value="" type="text" placeholder="Ej. Jessica Lizeth">
        </ion-item>

        <ion-item lines="none">
          <ion-label position="stacked">Apellidos(s)</ion-label>
          <input value="" type="text" placeholder="Ej. Juarez Hernandez">
        </ion-item>

        <ion-item lines="none">
          <ion-label position="stacked">Username</ion-label>
          <input value="" type="text" placeholder="Iceli">
        </ion-item>

        <ion-item lines="none">
          <ion-label position="stacked">Correo electronico</ion-label>
          <input value="" type="email" placeholder="lizethjh17@gmail.com">
        </ion-item>
        
        <ion-item lines="none">
          <ion-label position="stacked">Género</ion-label>
          <ion-select class="ion-margin-bottom" mode="md" aria-label="Genero" interface="popover" placeholder="Seleccionar">
            <ion-select-option value="femenino">Femenino</ion-select-option>
            <ion-select-option value="masculino">Masculino</ion-select-option>
            <ion-select-option value="39 tipos de gays🏳️‍🌈">39 tipos de gays🏳️‍🌈</ion-select-option>
          </ion-select>
        </ion-item>

        <ion-item lines="none">
          <ion-label position="stacked">Contraseña</ion-label>
          <ion-input class="ion-margin-bottom" type="password">
            <ion-input-password-toggle slot="end"></ion-input-password-toggle>
          </ion-input>
        </ion-item>

        <ion-item lines="none">
          <ion-label position="stacked">Confirmar contraseña</ion-label>
          <ion-input type="password">
            <ion-input-password-toggle slot="end"></ion-input-password-toggle>
          </ion-input>
        </ion-item>

        <ion-button type="submit" size="large" class="btnCustom" expand="block">Registrarse</ion-button>
      </form>

      <p>¿Ya tienes una cuenta? <a routerLink="/auth/login">Iniciar Sesión</a></p>
      </ion-item-group>
    </ion-list>
  </ion-row>
</ion-content>
