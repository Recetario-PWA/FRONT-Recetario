<ion-content [fullscreen]="true">
<ion-header class="ion-no-border">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-back-button mode="md" defaultHref="/" text=""></ion-back-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  <ion-grid>
    <ion-label color="white" class="ion-margin title">
      Recuperar contraseña
    </ion-label>
    <h4 class="info ion-margin">Ingresa tu nueva contraseña para regresar a la comunidad.</h4>
  </ion-grid>

  <ion-row>
    <ion-list lines="full">
      <ion-item-group class="ion-margin-bottom">
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        
        <ion-item lines="none" class="ion-margin-bottom">
          <ion-label position="stacked">Nueva contraseña</ion-label>
          <ion-input formControlName="password" type="password">
            <ion-input-password-toggle slot="end"></ion-input-password-toggle>
          </ion-input>
          <app-error-messages [control]="getControl('password')" label="Este campo" messageFormat="Mínimo 8 caracteres de longitud. Debe incluir al menos una mayúscula, una minúscula, un número y un símbolo"></app-error-messages>
        </ion-item>

        <ion-item lines="none">
          <ion-label position="stacked">Confirmar contraseña</ion-label>
          <ion-input formControlName="password_confirmation" type="password">
            <ion-input-password-toggle slot="end"></ion-input-password-toggle>
          </ion-input>
          <app-error-messages [control]="getControl('password_confirmation')" label="Este campo" messageFormat="Mínimo 8 caracteres de longitud. Debe incluir al menos una mayúscula, una minúscula, un número y un símbolo"></app-error-messages>
        </ion-item>

        <ion-button type="submit" [disabled]="loading()" size="large" class="btnCustom ion-margin-horizontal" expand="block">Cambiar contraseña</ion-button>
      </form>

      </ion-item-group>
    </ion-list>
  </ion-row>
</ion-content>
