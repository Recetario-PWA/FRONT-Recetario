<ion-header class="ion-no-border" mode="ios">
  <ion-toolbar class="wrapper">
    <ion-item lines="none">
    <!-- <ion-buttons slot="start">
        <ion-back-button defaultHref="/" text=""></ion-back-button>
      </ion-buttons> -->
      <ion-label>
        <p>Notificaciones</p>
      </ion-label>

      <ion-button size="medium" shape="round">
        <ion-icon slot="icon-only" name="notifications-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-toolbar>
</ion-header>

<ion-content class="hide-scrollbar">
  <ion-list lines="none">
  <ion-list-header>
    <ion-label class="day">Hoy</ion-label>
  </ion-list-header>
  @defer (when !loading()) {
    @for (msg of messages; track msg.id) {
      <ion-item [class.unread]="!msg.read" (click)="markAsRead(msg)">
        <ion-avatar slot="start">
          <img alt="User profile photo" src="https://ionicframework.com/docs/img/demos/avatar.svg" />
        </ion-avatar>
        <ion-label class="comment-label-container">
          <div class="user-info-line">
            <ion-text>{{msg.user}}</ion-text>
            <ion-text>comentó tu receta</ion-text>
          </div>
          <div class="recipe-info-line">
            <ion-text class="recipe-title">{{msg.recipe}}</ion-text>
          </div>
          <span class="time-stamp">{{msg.time}}</span>
        </ion-label>

        <ion-thumbnail slot="end">
          <img src="https://ionicframework.com/docs/img/demos/thumbnail.svg"  />
        </ion-thumbnail>
      </ion-item>
    }
  } @placeholder {
    @for (skeleton of skeletons; track $index) {
      <ion-item lines="none">
        <ion-thumbnail slot="start" class="userSkeleton">
          <ion-skeleton-text [animated]="true"></ion-skeleton-text>
        </ion-thumbnail>
        <ion-label>
          <h3>
            <ion-skeleton-text [animated]="true" style="width: 60%;"></ion-skeleton-text>
          </h3>
          <p>
            <ion-skeleton-text [animated]="true" style="width: 60%;"></ion-skeleton-text>
          </p>
          <p>
            <ion-skeleton-text [animated]="true" style="width: 30%;"></ion-skeleton-text>
          </p>
        </ion-label>
        <ion-thumbnail slot="end" class="recipeImgSkeleton">
          <ion-skeleton-text [animated]="true"></ion-skeleton-text>
        </ion-thumbnail>
    </ion-item>
    }
  }
  <!-- <ion-list-header>
    <ion-label class="day">Esta semana</ion-label>
  </ion-list-header>
  <ion-list-header>
    <ion-label class="day">Antiguas</ion-label>
  </ion-list-header> -->
</ion-list>
</ion-content>
