<ion-header class="ion-no-border" mode="ios">
  <ion-toolbar class="wrapper">
    <ion-item lines="none">
    <!-- <ion-buttons slot="start">
        <ion-back-button defaultHref="/" text=""></ion-back-button>
      </ion-buttons> -->
      <ion-label>
        <p>Favoritas</p>
      </ion-label>
    </ion-item>
    <ion-searchbar class="custom-searchbar" debounce="800" inputmode="search" mode="ios" placeholder="Buscar receta"></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content class="hide-scrollbar">
  <ion-row class="ion-margin">
      <!-- RECIPE CARDS -->
      @defer (when !loading()) {
        @for (recipe of favRecipes; track recipe.id) {
          <ion-col sizeLg="3" sizeMd="4" sizeSm="6" sizeXl="3" sizeXs="6">
            <app-recipe-card [recipe_id]="recipe.id" [title]="recipe.title" [rating]="recipe.rating" [cooking_time]="recipe.cooking_time" [image_url]="recipe.image_url"></app-recipe-card>
          </ion-col>
        } @empty {
          <div class="ion-text-center ion-padding">
            <h4>No hay recetas disponibles 😔</h4>
          </div>
        }
      } @placeholder {
        @for (skeleton of skeletons; track $index) {
          <ion-col sizeLg="3" sizeMd="4" sizeSm="6" sizeXl="3" sizeXs="6">
            <ion-card>
              <ion-thumbnail>
                <ion-skeleton-text [animated]="true"></ion-skeleton-text>
                <ion-item lines="none">
                  <ion-label>
                    <ion-skeleton-text [animated]="true" style="width: 80%;"></ion-skeleton-text>
                    <ion-skeleton-text [animated]="true" style="width: 35%; margin-top: 0.5rem;"></ion-skeleton-text>
                  </ion-label>
                </ion-item>
              </ion-thumbnail>
            </ion-card>
          </ion-col>
        }
      }
    </ion-row>
</ion-content>
