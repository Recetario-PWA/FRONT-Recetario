<ion-header class="ion-no-border" mode="ios">
  <ion-toolbar class="wrapper">
    <ion-item lines="none">
    <!-- <ion-buttons slot="start">
        <ion-back-button defaultHref="/" text=""></ion-back-button>
      </ion-buttons> -->
      <ion-label>
        <p>Perfil</p>
      </ion-label>
    </ion-item>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-item lines="none" class="ion-margin">
    <ion-avatar slot="start" class="big-avatar">
      <img alt="Avatar" [src]="getIcon()" />
    </ion-avatar>

    <ion-label class="ion-margin-top ion-margin-hortizontal">
      {{ (user()?.name && user()?.last_name) ? user()?.name + ' ' + user()?.last_name : 'Name Lastname' }}
      <h3>{{ user()?.user_name || 'User' }}</h3>
    <!-- <ion-button size="small" color="primary">Editar perfil</ion-button> -->
    </ion-label>
  </ion-item>

  <ion-list lines="none" inset="true">
    <ion-item (click)="goToPage('edit-profile')" class="ion-margin-start ion-margin-bottom">
      <ion-icon slot="start" name="person-outline"></ion-icon>
      <label>Editar perfil</label>
      <ion-icon slot="end" name="chevron-forward-outline"></ion-icon>
    </ion-item>
    <ion-item (click)="goToPage('my-recipes')" class="ion-margin-start ion-margin-bottom">
      <ion-icon slot="start" name="restaurant-outline"></ion-icon>
      <label>Mis recetas</label>
      <ion-icon slot="end" name="chevron-forward-outline"></ion-icon>
    </ion-item>
    <ion-item (click)="goToPage('my-comments')" class="ion-margin-start ion-margin-bottom">
      <ion-icon slot="start" name="chatbubbles-outline"></ion-icon>
      <label>Historial de comentarios</label>
      <ion-icon slot="end" name="chevron-forward-outline"></ion-icon>
    </ion-item>
    <!--<ion-item>
      <ion-icon slot="start" name="moon-outline"></ion-icon>
      <ion-toggle [(ngModel)]="paletteToggle" (ionChange)="toggleChange($event)" justify="space-between">Dark Mode</ion-toggle>
    </ion-item>-->
    <ion-item (click)="logout()" class="ion-margin-start ion-margin-bottom">
      <ion-icon slot="start" name="log-out-outline"></ion-icon>
      <label>Cerrar sesión</label>
    </ion-item>
  </ion-list>
</ion-content>
