<ion-header class="ion-no-border" mode="ios">
  <ion-toolbar class="wrapper">
    <ion-item lines="none">
      <ion-label>
        <p>Solicitar cambio de rol</p>
      </ion-label>
    </ion-item>
  </ion-toolbar>
</ion-header>

<ion-content class="hide-scrollbar">
    <div class="ilustration-container"> 
        <img src="https://recetariopwa.sfo3.digitaloceanspaces.com/pote-de-cocinar.png" alt="Imagen ilustrativa" class="chef-ilustration"> 
    </div>
    <p class="indication ion-padding-horizontal ion-padding-top ion-margin">
        ¡Excelente! Estás a un paso de compartir tus creaciones. 👩‍🍳👨‍🍳
        <br><br>
        Para poder publicar tus propias recetas necesitas ser usuario tipo <strong>Chef</strong>.
        <br>
        Puedes enviar tu solicitud a continuación; solo debes indicar el motivo.
      <!--  <br>
        Un administrador revisará tu solicitud y, posteriormente, la aprobará o rechazará. Recibirás una notificación con la decisión. -->
        <br><br>
        ¡Esperamos ver tus recetas pronto!
    </p>

    <div class="addCommentContainer ion-padding-horizontal ion-margin">
      <form [formGroup]="requestForm" (ngSubmit)="onSubmit()">
        <div class="inputContainer">
          <textarea formControlName="comment" autocapitalize="on" wrap="hard" minlength="20" maxlength="1000" spellcheck="true" rows="5" placeholder="Redacta tu motivo"></textarea>
        </div>
        <app-error-messages label="Este campo" [control]="getControl('comment')"></app-error-messages>

        <ion-button [disabled]="loading()" type="submit" class="customBtn">
          Enviar solicitud
        </ion-button>
      </form>
    </div>
</ion-content>
