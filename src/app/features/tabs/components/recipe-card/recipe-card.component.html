<ion-card>
  <ion-thumbnail>
    <ion-img [src]="image_url && image_url.trim() !== '' ? image_url : 'https://ionicframework.com/docs/img/demos/thumbnail.svg'"></ion-img>

    <div class="rating">
      <ion-icon name="star" color="warning"></ion-icon>
       {{ rating }}
    </div>

    <ion-button class="favorite" size="small" shape="round">
      <ion-icon slot="icon-only" name="heart-outline"></ion-icon>
    </ion-button>
  </ion-thumbnail>

  <ion-item lines="none">
    <ion-label>
      <ion-text>
        <strong>{{ title }}</strong>
      </ion-text>

      <p class="time-info">
        <ion-icon name="time-outline"></ion-icon>
        <ion-text>
          <small>{{ cooking_time }} min</small>
        </ion-text>
      </p>
    </ion-label>
    
  </ion-item>
</ion-card>
