<ion-tabs>  

  @if (user()?.rol.role === 'user' || user()?.rol.role === 'admin') {
    <ion-fab vertical="bottom" horizontal="center" translucent="true" (click)="goToCreateEditRecipe()">
      <ion-fab-button>
        <ion-icon [name]="isTabActive('recipe/add') ? 'restaurant' : 'restaurant-outline'"></ion-icon>
      </ion-fab-button>
    </ion-fab>
  } @else {
    <ion-fab vertical="bottom" horizontal="center" translucent="true" (click)="goToSendRolRequest()">
      <ion-fab-button>
        <ion-icon [name]="isTabActive('send-rol-Request') ? 'restaurant' : 'restaurant-outline'"></ion-icon>
      </ion-fab-button>
    </ion-fab>
  }
  
  <ion-tab-bar slot="bottom" class="ion-no-border">
    <ion-tab-button tab="home">
      <ion-icon [name]="isTabActive('home') ? 'home' : 'home-outline'"></ion-icon>
    </ion-tab-button>

    <ion-tab-button tab="favorites">
      <ion-icon [name]="isTabActive('favorites') ? 'heart' : 'heart-outline'"></ion-icon>
    </ion-tab-button>

    <svg height="50" viewBox="0 0 100 50" width="100" xmlns="http://www.w3.org/2000/svg"><path d="M100 0v50H0V0c.543 27.153 22.72 49 50 49S99.457 27.153 99.99 0h.01z" fill="red" fill-rule="evenodd"></path></svg>

    <ion-tab-button tab="notifications">
      <ion-icon [name]="isTabActive('notifications') ? 'notifications' : 'notifications-outline'"></ion-icon>
      
      @if (hasUnreadNotifications()) {
        <ion-badge class="notification-dot"></ion-badge>
      }
    </ion-tab-button>

    <ion-tab-button tab="dashboard">
      <ion-icon [name]="isTabActive('dashboard') ? 'person' : 'person-outline'"></ion-icon>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
